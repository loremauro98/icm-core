[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icm-core"
version = "1.0.0"
description = "Interpretable Context Methodology (ICM) & Skills Operating System"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "ICM Framework Team" }]
license = { text = "MIT" }

[project.scripts]
icm = "bootstrap:cli"
